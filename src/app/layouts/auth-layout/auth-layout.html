<div class="auth-layout">
  <app-network-background />

  <header class="auth-header">
    <a class="brand-cluster" [routerLink]="paths.root">
      <app-brand-mark />
      <span class="brand">{{ 'common.appName' | translate }}</span>
    </a>
    <span class="brand-tagline">{{ 'common.brandTagline' | translate }}</span>
    <div class="header-actions">
      <app-language-toggle />
      <app-theme-toggle />
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <span class="auth-card__sticker sticker" data-tone="healthy" aria-hidden="true">{{ 'common.chartSticker' | translate }}</span>
      <div [@routeTransition]="true">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
