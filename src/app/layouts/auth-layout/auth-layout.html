<div class="auth-layout">
  <app-network-background />

  <header class="auth-header">
    <span class="brand">{{ 'common.appName' | translate }}</span>
    <div class="header-actions">
      <app-language-toggle />
      <app-theme-toggle />
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div [@routeTransition]="true">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
