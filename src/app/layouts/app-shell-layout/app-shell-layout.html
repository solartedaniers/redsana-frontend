<div class="app-shell" [class.app-shell--nav-open]="isNavOpen()" (keydown.escape)="closeNav()">
  <aside id="app-sidebar" class="sidebar">
    <app-sidebar-nav [items]="navItems()" />
  </aside>
  @if (isNavOpen()) {
    <button type="button" class="nav-backdrop" (click)="closeNav()" [attr.aria-label]="'common.closeMenu' | translate"></button>
  }
  <div class="shell-main">
    <app-top-bar (signOut)="onSignOut()" (menuToggle)="toggleNav()" [isMenuOpen]="isNavOpen()" />
    <main class="shell-content" [@routeTransition]="true">
      <router-outlet />
    </main>
  </div>
</div>
