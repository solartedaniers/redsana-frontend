@if (visibleStatus(); as status) {
  <span class="ai-status" role="status" aria-live="polite">
    <span class="sticker" [attr.data-tone]="tone()" [attr.data-ai-status]="status">
      <span class="ai-status__label">{{ 'common.aiStatus.' + status | translate }}</span>
    </span>
    @if (status === 'unavailable') {
      <button type="button" class="subtle-button ai-status__retry" (click)="aiStatus.retry()">
        {{ 'common.aiStatus.retry' | translate }}
      </button>
    }
  </span>
}
