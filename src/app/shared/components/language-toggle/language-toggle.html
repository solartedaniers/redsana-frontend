<div class="language-toggle" role="group" [attr.aria-label]="'common.language' | translate">
  <button type="button" [class.active]="i18n.language() === 'es'" (click)="switchTo('es')">ES</button>
  <button type="button" [class.active]="i18n.language() === 'en'" (click)="switchTo('en')">EN</button>
</div>
