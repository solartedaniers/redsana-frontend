<header class="top-bar">
  <div class="brand-group">
    <button
      type="button"
      class="menu-button"
      (click)="menuToggle.emit()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="app-sidebar"
      [attr.aria-label]="'common.menu' | translate"
    >
      <app-icon name="menu" />
    </button>
    <span class="brand">{{ 'common.appName' | translate }}</span>
  </div>
  <div class="actions">
    <app-language-toggle />
    <app-theme-toggle />
    @if (auth.currentUser(); as user) {
      <a class="user-chip" [routerLink]="paths.profile" [attr.aria-label]="'auth.profile.title' | translate">
        <span class="user-avatar">
          @if (user.avatarUrl) {
            <img [src]="user.avatarUrl" [alt]="user.fullName" />
          } @else {
            <app-icon name="user" />
          }
        </span>
        <span class="user-name">{{ user.fullName }}</span>
      </a>
    }
    <button
      type="button"
      class="logout-button"
      (click)="signOut.emit()"
      [attr.aria-label]="'common.logout' | translate"
    >
      <app-icon name="logout" />
    </button>
  </div>
</header>
