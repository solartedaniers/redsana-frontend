@let result = strength();
<div class="strength" [attr.data-level]="result.level">
  <div class="strength__head">
    <app-icon name="shield" />
    <span class="strength__label">{{ 'auth.passwordStrength.label' | translate }}</span>
    <strong class="strength__level" aria-live="polite">
      @if (result.level) {
        {{ 'auth.passwordStrength.levels.' + result.level | translate }}
      } @else {
        <span class="visually-hidden">{{ 'auth.passwordStrength.levels.empty' | translate }}</span>
      }
    </strong>
  </div>
  <div
    class="strength__bars"
    role="meter"
    aria-valuemin="0"
    [attr.aria-valuemax]="result.totalCriteria"
    [attr.aria-valuenow]="result.metCount"
    [attr.aria-label]="'auth.passwordStrength.label' | translate"
  >
    @for (bar of bars; track bar) {
      <i [class.is-on]="bar < result.metCount"></i>
    }
  </div>
</div>
