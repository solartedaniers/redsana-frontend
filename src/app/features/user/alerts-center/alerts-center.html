<section class="alerts-hero">
  <app-page-header titleKey="user.alertsCenter.title" subtitleKey="user.alertsCenter.subtitle" />
</section>

<div class="alerts-layout workspace-grid workspace-grid--two">
  <section class="alerts-list surface-panel" [@listStagger]="alerts().length">
    <div class="surface-panel__header"><h2 class="surface-panel__title">{{ 'user.alertsCenter.timelineTitle' | translate }}</h2></div>
    @if (alerts().length === 0) {
      <p class="alerts-empty">{{ 'user.alertsCenter.empty' | translate }}</p>
    } @else {
      <ol class="timeline">
        @for (alert of alerts(); track alert.id) {
          <li class="timeline__entry" [attr.data-severity]="alert.severity">
            <app-alert-item [alert]="alert" (acknowledge)="onAcknowledge($event)" />
          </li>
        }
      </ol>
    }
  </section>
  <aside class="summary-panel surface-panel">
    <div class="surface-panel__header"><h2 class="surface-panel__title">{{ 'user.alertsCenter.summaryTitle' | translate }}</h2></div>
    <app-alerts-summary [alerts]="alerts()" />
  </aside>
</div>
