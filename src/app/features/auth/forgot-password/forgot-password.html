<h2 class="form-title">{{ 'auth.forgotPassword.title' | translate }}</h2>

@if (submitted()) {
  <p class="form-success">{{ 'auth.forgotPassword.successMessage' | translate }}</p>
} @else {
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>{{ 'auth.login.email' | translate }}</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="field-error">{{ 'auth.errors.invalidEmail' | translate }}</small>
      }
    </label>

    <button type="submit" class="submit-button" [disabled]="isSubmitting()">
      {{ (isSubmitting() ? 'common.loading' : 'auth.forgotPassword.submit') | translate }}
    </button>
  </form>
}

<div class="form-links">
  <a routerLink="/auth/login">{{ 'auth.forgotPassword.backToLogin' | translate }}</a>
</div>
