<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- El título, el lang y las etiquetas para buscadores y redes los pone DocumentMetadataService desde i18n. -->
  <title></title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#07090a">
</head>
<body>
  <!-- Splash mientras carga Angular, que reemplaza el contenido de app-root al arrancar. La ruta de la marca es
       BRAND_ASSETS.symbolMask (lo comprueba scripts/brand-assets.test.mjs). -->
  <app-root>
    <div class="startup-screen" aria-hidden="true" style="--brand-symbol-mask: url(assets/branding/brand-symbol-mask.png)">
      <span class="startup-screen__symbol"></span>
    </div>
  </app-root>
</body>
</html>
